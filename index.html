<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pokédex desenvolvida com HTML, CSS e JavaScript, que utiliza a PokéAPI para obter as informações sobre os Pokémons."
    />
    <title>Pokédex</title>
    <link
      rel="shortcut icon"
      href="./src/assets/icons/favicon.svg"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/css/global.css" />
    <link rel="stylesheet" href="./src/css/pokemons-colors.css" />
    <link rel="stylesheet" href="./src/css/pokedex.css" />
    <link rel="stylesheet" href="./src/css/modal.css" />
  </head>
  <body>
    <main>
      <section class="content">
        <h1 class="title">P<span>o</span>kédex</h1>

        <ol id="pokemonList" class="pokemons"></ol>

        <div class="pagination">
          <button
            id="loadMoreButton"
            type="button"
            data-loading="Carregando..."
            data-ready="Carregar Mais"
          >
            Carregar Mais
          </button>
        </div>
        <div id="modal" class="modal hidden">
          <div class="panel">
            <div class="header">
              <h2 id="modalName" class="name">Pokemon</h2>
              <p id="modalNumber" class="number">#3</p>
            </div>
            <div id="modalPhotoWrapper" class="details">
              <img id="modalPhoto" class="photo" src="" alt="" />
            </div>
            <div id="modalTypes" class="types"></div>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <p>
        <a class="link" href="https://github.com/GracilianoOG"
          >Desenvolvido por Gabriel Graciliano</a
        >
      </p>
    </footer>
    <script src="./src/js/main.js" type="module"></script>
  </body>
</html>
